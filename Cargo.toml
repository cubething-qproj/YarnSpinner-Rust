[workspace]
resolver = "2"

members = [
    "crates/example_dialogue_view",
    "crates/bevy_plugin",
    "crates/yarnspinner",
    "crates/runtime",
    "crates/compiler",
    "crates/core",
    "crates/codegen",
    "crates/internal_shared",
    "demo",
    "examples/bevy_yarnspinner",
    "examples/yarnspinner_without_bevy",
]

# The published crates are migrated to Bevy 0.19; the `demo` binary and the
# `examples/bevy_yarnspinner` showcase still depend on Bevy renderer/scene APIs
# that changed between 0.18 and 0.19 (SceneRoot, Hdr, DirectionalLight,
# Sprite3d, Bundle, AlphaMode, etc.) and have not been ported yet. They are
# excluded from the default workspace build so `cargo build`/`cargo test`
# stay green; build them explicitly with `-p bevy_yarnspinner_demo` to work on
# them.
default-members = [
    "crates/example_dialogue_view",
    "crates/bevy_plugin",
    "crates/yarnspinner",
    "crates/runtime",
    "crates/compiler",
    "crates/core",
    "crates/codegen",
    "crates/internal_shared",
    "examples/yarnspinner_without_bevy",
]

# Source: https://github.com/bevyengine/bevy/blob/main/examples/README.md#1-tweak-your-cargotoml
## Make Wasm builds as small as possible
[profile.wasm-release]
inherits = "release"
opt-level = "z"
lto = "fat"
codegen-units = 1
